# Dependabot configuration for swarm-hpa.
# Keeps Go modules, Dockerfile base images, and GitHub Actions versions current.
# Minor/patch dependency updates are grouped to keep PR volume low; security
# advisories still open as individual, prioritized PRs.
version: 2

updates:
  # Go modules.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      go-minor-patch:
        # Group non-major Go updates into one PR. Major updates (v2→v3 etc.) and
        # security advisories open separately so they get reviewed individually.
        update-types:
          - minor
          - patch
    ignore:
      # docker/cli v29 removed the deprecated stack.NewStackCommand cobra API that
      # internal/adapter/stackdeploy/dockercli.go depends on for the programmatic
      # `docker stack deploy` (build fails: undefined: stack.NewStackCommand). The
      # 28→29 jump needs a code migration of the stackdeploy adapter — tracked
      # separately. Ignore its MAJOR bumps until that lands; minor/patch updates of
      # docker/cli still come through, and security advisories are never ignored.
      - dependency-name: github.com/docker/cli
        update-types:
          - version-update:semver-major

  # Dockerfile base images (golang build stage + alpine runtime).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions versions used in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        update-types:
          - minor
          - patch
