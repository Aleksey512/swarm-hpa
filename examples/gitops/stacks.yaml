# stacks.yaml — one entry per stack (drop-in swarm-cd format).
# =============================================================================
# The key is the Swarm stack namespace swarm-hpa deploys as
# (`docker stack deploy demoapp`). Each stack points at a repo (key in
# repos.yaml), a branch, and a repo-relative compose file. Full field reference:
#   ../../docs/gitops.md
#
# Scope of THIS example: carry-forward + drift only. It deliberately omits:
#   values_file            — compose templating ({{ .Values.* }})
#   sops_files             — sops-encrypted secrets to decrypt before deploy
#   sops_secrets_discovery — auto-discover sops files from compose `secrets:`
# Both are documented in ../../docs/gitops.md.
# =============================================================================
demoapp:
  repo: demoapp
  branch: main
  compose_file: compose.yaml
  # pull_policy: always   # override the global --gitops-pull-policy for this stack only

# --- Multiple compose files per stack (optional) ------------------------------
# compose_file also accepts a LIST of files. They are deployed in list order,
# one `docker stack deploy` each (NOT merged — each file must be self-contained),
# and each can carry its own pull_policy. Precedence: file → stack → global.
# See docs/gitops.md#multiple-compose-files-per-stack.
#
# Split into several files for convenience (independent service groups):
#   demoapp:
#     repo: demoapp
#     compose_file:
#       - compose.yaml
#       - postgres.yaml
#
# Per-file image pull policy — e.g. refresh a :dev app every sync, but don't
# re-pull a pinned postgres image:
#   demoapp:
#     repo: demoapp
#     compose_file:
#       - file: compose.yaml
#         pull_policy: always
#       - file: postgres.yaml
#         pull_policy: changed

# --- Compose overrides: MERGED into one deploy (optional) ---------------------
# Different mechanism from the list above — do not confuse the two:
#
#   several ENTRIES        -> several `docker stack deploy`, additive, NO merge,
#                             each file must be self-contained
#   `overrides:` in ONE    -> ONE `docker stack deploy` with several -c flags,
#   entry                     merged by docker/cli last-wins; an override needs
#                             only the keys it changes
#
# This is the Swarm equivalent of compose's `include:`, which Swarm does not
# support. Use it to keep one base stack and re-parameterize it per environment
# (env vars, image tags, limits). See docs/gitops.md#compose-overrides-merged-deploy.
#
#   demoapp:
#     repo: demoapp
#     compose_file:
#       - file: compose.yaml
#         overrides:
#           - compose.prod.yaml   # merged into the SAME deploy as compose.yaml
#         pull_policy: always     # per GROUP: one --resolve-image per deploy
#       - postgres.yaml           # separate, additive deploy (not merged)
#
# ...deploys as:
#   docker stack deploy -c compose.yaml -c compose.prod.yaml demoapp
#   docker stack deploy -c postgres.yaml demoapp
#
# GET /stacks lists each group's overrides under its base file.
